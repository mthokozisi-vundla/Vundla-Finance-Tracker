<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions | Vundla Finance</title>
    <script src="js/transactions.js" defer></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Website Header -->
    <header class="site-header">
      <h1>Vundla Finance</h1>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a class="nav-link" href="dashboard.html">Dashboard</a>
        <a class="nav-link" href="transactional.html">Transactions</a>
        <a class="nav-link" href="budgets.html">Budgets</a>
        <a class="nav-link" href="categories.html">Categories</a>
        <a class="nav-link" href="#" id="logout-link">Logout</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <section>
        <h2>Transaction Management</h2>
        <p>View and manage your income and expenses.</p>
      </section>

      <!-- Add Transaction Button -->
      <section class="recent-transactions">
        <button id="add-transaction-btn">Add Transaction</button>

        <!-- Transaction Form -->
        <form id="transaction-form" style="display: none">
          <h3>Add New Transaction</h3>

          <label for="description">Description</label>
          <input
            type="text"
            id="description"
            placeholder="e.g. Groceries"
            required
          />

          <label for="amount">Amount (R)</label>
          <input
            type="number"
            id="amount"
            placeholder="e.g. 500"
            min="0.01"
            step="0.01"
            required
          />

          <label for="date">Date</label>
          <input type="date" id="date" required />

          <label for="type">Transaction Type</label>
          <select id="type" required>
            <option value="">Select type</option>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
          </select>

          <label for="category">Category</label>
          <select id="category" required>
            <option value="">Select category</option>
          </select>

          <button type="submit">Save Transaction</button>
          <button type="button" id="cancel-transaction-btn">Cancel</button>
        </form>
      </section>

      <!-- Search and Filter -->
      <section>
        <h2>All Transactions</h2>

        <label for="transaction-search">Search transactions</label>
        <input
          type="text"
          id="transaction-search"
          placeholder="Search by description or category..."
        />

        <label for="transaction-type-filter">Filter by type</label>
        <select id="transaction-type-filter">
          <option value="">All Transactions</option>
          <option value="Income">Income</option>
          <option value="Expense">Expense</option>
        </select>
      </section>

      <!-- Transactions Table -->
      <section class="transactions-table">
        <table>
          <thead>
            <tr>
              <th>Description</th>
              <th>Category</th>
              <th>Date</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="transactions-list"></tbody>
        </table>
      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <p>&copy; 2026 Vundla Finance. All rights reserved.</p>
    </footer>
  </body>
</html>
