<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vundla Finance Tracker</title>
  </head>
  <body>
    <!--website header-->
    <header>
      <h1>Vundla Finance Tracker</h1>
    </header>

    <!--Website Navigation-->
    <nav>
      <a href="index.html">Home</a>
      <a href="#">Login</a>
      <a href="#">Register</a>
    </nav>
    <!--Main content-->
    <main>
      <!--Welcome section-->
      <section>
        <h2>Manage Your Money</h2>
        <p>Track your income, expenses and monthly budgets.</p>
      </section>
      <section>
        <h2>Create an Account</h2>

        <form>
          <div>
            <label for="full-name">Full Name</label>
            <input
              type="text"
              id="full-name"
              name="full_name"
              placeholder="Enter your full name"
              minlength="2"
              maxlength="50"
              required
            />
          </div>

          <div>
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email address"
              required
            />
          </div>
          <div>
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              minlength="8"
              maxlength="64"
              required
            />
          </div>

          <button type="submit">Create Account</button>
        </form>
      </section>
      <!--Transaction Form Section-->
      <section>
        <h2>Add a Transaction</h2>

        <form>
          <!--Transaction Type-->
          <div>
            <label for="transaction-type"> Transaction Type </label>

            <select id="transaction-type" name="transaction_type" required>
              <option value="">Select transaction type</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>

          <!--Transaction Amount-->
          <div>
            <label for="amount">Transaction Amount(R)</label>

            <input
              type="number"
              id="amount"
              name="amount"
              placeholder="Enter transaction amount"
              min="0.01"
              max="1000000"
              step="0.01"
              required
            />
          </div>

          <!--Transaction Date-->
          <div>
            <label for="transaction-date"> Transaction Date </label>

            <input
              type="date"
              id="transaction-date"
              name="transaction_date"
              required
            />
          </div>

          <!--Transaction Note-->
          <div>
            <label for="transaction-note"> Description (Optional) </label>

            <textarea
              id="transaction-note"
              name="transaction_note"
              rows="5"
              placeholder="Describe your transaction..."
            >
            </textarea>
          </div>

          <button type="submit">Save Transaction</button>
        </form>
      </section>
    </main>

    <!--Website Footer-->
    <footer>
      <p>&copy; 2026 Vundla Finance Tracker. All rights reserved.</p>
    </footer>
  </body>
</html>
